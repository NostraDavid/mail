[workspace]
members = [
  "crates/mail",
  "crates/mail-engine",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
authors = ["mail contributors"]

[workspace.dependencies]
anyhow = "1.0.104"
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "fira-sans", "linux-theme-detection", "tokio", "x11", "wayland"] }
libsql = { version = "0.10.0", default-features = false, features = ["core"] }
oauth2 = "5.0.0"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"
webbrowser = "1.2.5"
